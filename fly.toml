# fly.toml app configuration file generated for zu-auditintel on 2026-11-15T15:24:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'zu-auditintel'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  DataProtection__KeysPath = '/data/keys'
  EvidenceFiles__Root = '/data/evidence'
  LocalDb__Path = '/data/zu_auditintel.db'
  PORT = '10000'

[[mounts]]
  source = 'zu_data'
  destination = '/data'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
